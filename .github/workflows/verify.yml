name: Verify Mandarin speaker separation

on:
  push:
    branches: [mandarin-speaker-separation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} CPU
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        shell: bash
        run: |
          python -m pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install --no-deps asteroid==0.7.0
      - name: Run regression checks
        run: python -m unittest discover -s tests -v
      - name: Fetch verified model weights
        run: python fetch_models.py
      - name: Run and inspect the bundled sample
        if: runner.os != 'Windows'
        run: |
          python process_meeting.py demo/mixed.wav --transcribe --out results/ci_demo
          python verify_demo.py results/ci_demo
      - name: Run and inspect the Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m venv --system-site-packages .venv
          if errorlevel 1 exit /b 1
          call process_meeting.bat "demo\mixed.wav" --transcribe --out "results\ci_demo"
          if errorlevel 1 exit /b 1
          python verify_demo.py "results\ci_demo"
